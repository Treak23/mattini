[project]
name = "mattini-pipeline"
version = "0.0.0"
description = "Offline data pipeline for mattini: swisstopo geodata to game assets"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fiona>=1.10.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "rasterio>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "gdtoolkit==4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mattini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that reach the real swisstopo servers are opt-in: `pytest -m network` (brief M0-04).
markers = ["network: reaches the real swisstopo servers; run only with -m network"]
addopts = "--strict-markers -m 'not network'"

[tool.ruff]
line-length = 100
